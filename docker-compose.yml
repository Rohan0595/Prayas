version: '3.9'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/faiss_index:/app/faiss_index
      - ./backend/omni_assistant.db:/app/omni_assistant.db

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
